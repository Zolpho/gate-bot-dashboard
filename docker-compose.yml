services:
  gate-bot-dashboard:
    container_name: gate-bot-dashboard
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "192.168.1.221:8080:8080"
    volumes:
      - gate_bot_data:/data
      - ./secrets:/run/config:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID

volumes:
  gate_bot_data:
