services:
  gate-bot-dashboard:
    container_name: gate-bot-dashboard
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "192.168.1.221:8080:8080"
    volumes:
      - gate_bot_data:/data
      - ./secrets:/run/config:ro
      # Gate API credentials stay read-only. Only the dashboard-user file is
      # mounted writable so authenticated users can change their own password.
      - ./secrets/dashboard_users.json:/run/secrets/dashboard_users.json
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID

volumes:
  gate_bot_data:
